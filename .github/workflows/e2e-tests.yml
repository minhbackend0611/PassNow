name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
        
    - name: Set up Java for Firebase Emulator
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Install Firebase Tools
      run: npm install -g firebase-tools
      
    - name: Create Dummy Env File
      run: |
        echo "VITE_FIREBASE_API_KEY=dummy" > .env.local
        echo "VITE_FIREBASE_AUTH_DOMAIN=dummy.firebaseapp.com" >> .env.local
        echo "VITE_FIREBASE_PROJECT_ID=dummy-project" >> .env.local
        echo "VITE_FIREBASE_STORAGE_BUCKET=dummy.appspot.com" >> .env.local
        echo "VITE_FIREBASE_MESSAGING_SENDER_ID=123456" >> .env.local
        echo "VITE_FIREBASE_APP_ID=1:123456:web:123456" >> .env.local

    - name: Run Playwright tests with Firebase Emulator
      run: firebase emulators:exec --project dummy-project "npx playwright test"
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
